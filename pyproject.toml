[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-gui"
version = "0.1.2"
description = "A simple GUI for Git operations"
authors = [{name = "Niladri Das"}]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "bandit",
    "ruff==0.16.9",
]
postgres = [
    "psycopg2-binary",
]

[project.scripts]
git-gui = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["main*"]
exclude = ["tests*", "docs*", "scripts*", "images*", "profile*"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# An explicit set keeps CI deterministic. Without this, ruff enables its whole
# catalog and new releases activate rules the code was never written against.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    # These scripts inspect return codes instead of raising, and probe Tk
    # widgets by catching exceptions on purpose.
    "PLW1510",
    "BLE001",
    "S110",
    # Shebangs are kept for direct invocation.
    "EXE001",
]
