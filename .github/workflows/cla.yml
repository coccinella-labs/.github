---
name: CLA
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'coccinella-labs'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            signed.json

      - name: Checkout private cla-bot
        uses: actions/checkout@v6
        with:
          repository: coccinella-labs/clabot
          token: ${{ secrets.GITHUB_TOKEN }}
          path: clabot

      - name: Copy signed.json to cla-signers.json
        run: |
          cp signed.json cla-signers.json
          cp signed.json clabot/cla-signers.json

      - name: Run CLA bot
        uses: ./clabot/
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
